name: Build

# Every push and pull request: run the tests and build TheRoyalCourt.exe (download it from the run's "Artifacts").
# Pushing a tag like v0.22.0, or pressing "Run workflow" on the Actions tab: also creates a DRAFT release
# (tag v<Version from src/RoyalCourt.Core/Util.cs>) with TheRoyalCourt.exe and SHA256SUMS.txt. You check the notes and press Publish.
on:
  push:
    branches: [main, csharp-port]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/RoyalCourt.Tests -c Release

      - name: Publish the single-file exe
        run: >
          dotnet publish src/RoyalCourt.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out

      - name: Package
        id: pkg
        run: |
          VER=$(grep -oP 'Version = "\K[^"]+' src/RoyalCourt.Core/Util.cs | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp out/TheRoyalCourt.exe dist/
          (cd dist && sha256sum TheRoyalCourt.exe > SHA256SUMS.txt)
          awk -v v="$VER" 'BEGIN{h="## [" v "]"} index($0,"## [")==1 { if (found) exit; if (index($0,h)==1) { found=1; next } } found' CHANGELOG.md > notes.md
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: TheRoyalCourt-v${{ steps.pkg.outputs.version }}
          path: dist/*

      - name: Create draft release (tag pushes and manual runs)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$VER" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version $VER"; exit 1; fi
          if gh release view "v$VER" >/dev/null 2>&1; then echo "Release v$VER already exists - nothing to do"; exit 1; fi
          gh release create "v$VER" dist/* --draft --target "$GITHUB_SHA" --title "The Royal Court v$VER" --notes-file notes.md
